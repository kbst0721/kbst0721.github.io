/* Header: restrained Liquid Glass bar */

}

  position: absolute;

  right: clamp(20px, 5vw, 72px);

}

@media (max-width: 768px) {
  .footer { padding-top: clamp(36px, 6vh, 60px); }

/* Releases — same title style as Links, calm flat cards in a row on PC */

/* JP / EN switch: a glass thumb glides between the two, like a segmented control */
.lang-switch {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 50%; right: auto;
  transform: translateX(calc(50vw - 122px));
  z-index: 60;
  transition: background .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease), transform .65s cubic-bezier(.3, 1.15, .3, 1), border-radius .65s cubic-bezier(.3, 1.15, .3, 1);
  height: 44px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 6px;
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.2),
    inset 0 0 0 1px rgba(255,255,255,.03),
    0 12px 32px rgba(0,0,0,.38);
}
.lang-thumb {
  position: absolute;
  top: 6px; bottom: 6px; left: 6px;
  width: 46px;
  border-radius: 999px;
  background: rgba(255,255,255,.13);
  transform: translateX(0);
  pointer-events: none;
}
.lang-switch.anim .lang-thumb { transition: transform .5s cubic-bezier(.3, 1.2, .3, 1); }
.lang-switch.is-en .lang-thumb { transform: translateX(48px); }
.lang-opt {
  position: relative;
  z-index: 1;
  width: 46px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-code);
  font-size: .68rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-indent: .14em;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(190,205,240,.5);
  cursor: pointer;
  transition: color .35s var(--ease);
}
.lang-opt:hover { color: rgba(255,255,255,.92); }
.lang-opt.is-active { color: #fff; }
.lang-opt:focus-visible { outline: 2px solid var(--pastel-blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .lang-switch.anim .lang-thumb { transition: none; } }

/* Language change: the texts themselves fade, drift and unblur */

body.lang-fading [data-i18n], body.lang-fading [data-i18n-html], body.lang-fading #gh-list {

  filter: blur(3px);
}
@media (prefers-reduced-motion: reduce) { [data-i18n], [data-i18n-html], #gh-list { transition: none; } }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes rise-h { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* releases.html: a plain subpage — no scroll snap */

@media (max-width: 640px) {

}

/* Back button: the mirror image of the JP/EN switch (top-left) */
.back-btn {

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.2),

    0 12px 32px rgba(0,0,0,.38);
  transition: border-color .5s var(--ease), background .5s var(--ease), box-shadow .5s var(--ease), transform .65s cubic-bezier(.3, 1.15, .3, 1), border-radius .65s cubic-bezier(.3, 1.15, .3, 1);
}

/* Small screens: back button, header and switch dock into one pill */

<script>
/* JP / EN switch (releases page): back label + subtitle. Same behaviour as the top page. */
(function () {
  var T = {
    jp: { back: "戻る", releasesSub: "リリース", releasesNote: "僕はApple Developerの有料アカウントに入っていないので署名をしていません。<br><code>xattr -dr</code>をお願いします" },
    en: { back: "Back", releasesSub: "Latest releases", releasesNote: "I don't have a paid Apple Developer account, so my apps aren't signed.<br>Please run <code>xattr -dr</code> first." }
  };
  var cur = "jp";
  try { cur = localStorage.getItem("kbst0721.lang") === "en" ? "en" : "jp"; } catch (e) {}
  var first = true, fadeTimer = null;
  function swapTexts(l) {
    window.__lang = l;
    document.documentElement.lang = l === "jp" ? "ja" : "en";
    var d = T[l];
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (d[k] != null) el.textContent = d[k];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var k = el.getAttribute("data-i18n-html");
      if (d[k] != null) el.innerHTML = d[k];
    });
    window.dispatchEvent(new CustomEvent("langchange", { detail: { lang: l } }));
  }
  function apply(l) {
    cur = l;
    document.querySelectorAll(".lang-opt").forEach(function (b) {
      b.classList.toggle("is-active", b.getAttribute("data-lang") === l);
    });
    var sw = document.querySelector(".lang-switch");
    if (sw) {
      sw.classList.toggle("is-en", l === "en");
      if (!sw.classList.contains("anim")) requestAnimationFrame(function () { sw.classList.add("anim"); });
    }
    try { localStorage.setItem("kbst0721.lang", l); } catch (e) {}
    if (first) { first = false; swapTexts(l); return; }
    document.body.classList.add("lang-fading");
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function () {
      swapTexts(l);
      document.body.classList.remove("lang-fading");
    }, 190);
  }
  document.querySelectorAll(".lang-opt").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-lang")); });
  });
  apply(cur);
})();
</script>
<script>
/* Releases: every entry from releases.json. */
(function () {
  var grid = document.getElementById("rel-grid");
  if (!grid || !window.fetch) return;
  var NOTES = {
    jp: { empty: "まだリリースがありません。", error: "リリースを取得できませんでした。", loading: "Loading…" },
    en: { empty: "No releases yet.", error: "Couldn't load releases.", loading: "Loading…" }
  };
  var items = null, failed = false;
  function lang() { return window.__lang === "en" ? "en" : "jp"; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function render() {
    var n = NOTES[lang()];
    grid.textContent = "";
    if (failed) { grid.appendChild(el("p", "rel-note", n.error)); return; }
    if (!items) { grid.appendChild(el("p", "rel-note", n.loading)); return; }
    if (!items.length) { grid.appendChild(el("p", "rel-note", n.empty)); return; }
    items.forEach(function (r) {
      var card = el(r.url ? "a" : "div", "rel-card");
      if (r.url) { card.href = r.url; card.target = "_blank"; card.rel = "noopener noreferrer"; if (/\.dmg($|\?)/i.test(r.url)) card.setAttribute("download", ""); }
      var top = el("div", "rel-top");
      top.appendChild(el("span", "rel-name", r.name || ""));
      if (r.version) top.appendChild(el("span", "rel-ver", /^v/i.test(r.version) ? r.version : "v" + r.version));
      card.appendChild(top);
      if (r.date) card.appendChild(el("div", "rel-date", r.date));
      var d = lang() === "en" && r.descriptionEn ? r.descriptionEn : r.description;
      if (d) card.appendChild(el("p", "rel-desc", d));
      grid.appendChild(card);
    });
  }
  window.addEventListener("langchange", render);
  render();
  fetch("releases.json", { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
    .then(function (data) {
      items = (data || []).slice().sort(function (a, b) { return (b.date || "") < (a.date || "") ? -1 : 1; });
      render();
    })
    .catch(function () { failed = true; render(); });
})();
</script>
<script>
/* Footer: live local time, visitor IP (blurred until clicked), and the
 * giant outline wordmark fitted to the full width — from the user's design. */
(function () {
  var el = document.getElementById("footer-clock");
  if (el) {
    var tick = function () {
      var d = new Date();
      el.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    };
    tick();
    setInterval(tick, 15000);
  }
  var btn = document.getElementById("footer-ip"), val = document.getElementById("footer-ip-value");
  if (btn && val && window.fetch) {
    fetch("https://api.ipify.org?format=json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) { if (d && d.ip) val.textContent = d.ip; })
      .catch(function () { val.textContent = "\u2014"; });
    btn.addEventListener("click", function () {
      var on = btn.classList.toggle("reveal");
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  var wrap = document.querySelector(".footer-mark-wrap"), mark = document.querySelector(".footer-mark");
  if (wrap && mark) {
    var fit = function () {
      var target = wrap.clientWidth;
      if (!target) return;
      var probe = 100;
      mark.style.fontSize = probe + "px";
      var w = mark.scrollWidth;
      if (!w) return;
      var size = probe * (target / w) * .99;
      var cap = window.innerHeight * .19;
      if (size > cap) size = cap;
      size = Math.floor(size * 10) / 10;
      mark.style.fontSize = Math.max(20, Math.min(640, size)) + "px";
    };
    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(fit, 80); });
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }
})();
</script>
<script>
/* Dock precisely: measure the three pills and centre them as one group,
 * so the seams are exact whatever the real widths are. */
(function () {
  var header = document.querySelector(".header");
  var back = document.querySelector(".back-btn");
  var sw = document.querySelector(".lang-switch");
  if (!header || !back || !sw) return;
  var mq = window.matchMedia("(max-width: 640px)");
  function dock() {
    if (!mq.matches) {
      back.style.transform = ""; header.style.transform = ""; sw.style.transform = "";
      return;
    }
    var bw = back.offsetWidth, hw = header.offsetWidth, swW = sw.offsetWidth;
    var left = -(bw + hw + swW) / 2;
    back.style.transform = "translateX(" + (left + 1) + "px)";
    header.style.transform = "translateX(" + (left + bw) + "px)";
    sw.style.transform = "translateX(" + (left + bw + hw - 1) + "px)";
  }
  window.addEventListener("resize", dock);
  window.addEventListener("langchange", function () { setTimeout(dock, 210); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(dock);
  dock();
})();
</script>
